<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
<title>Ligações elétricas do protótipo: ESP32 DevKit, GPS GY-GPS6MV2 e OLED SSD1306</title>
