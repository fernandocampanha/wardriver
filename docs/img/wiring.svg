<text x="40" y="559" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2937">= fios NÃO conectados</text>
<text x="40" y="578" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2937">Lógica de sinal: 3,3 V</text>
